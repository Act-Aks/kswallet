## ---------------------------------------------------------------------------
## KsWallet version catalog — the single source of truth for every dependency,
## plugin and SDK level used by the project.
## ---------------------------------------------------------------------------

# ═══════════════════════════════════════════════════════════════════════════
[versions]
# ═══════════════════════════════════════════════════════════════════════════

# --- Build tooling ---
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

# --- Dependency injection ---
koin = "4.2.2"
koinCompilerPlugin = "1.2.1"

# --- Persistence ---
room = "3.0.3"
sqlite = "2.7.1"
datastore = "1.2.1"

# --- UI ---
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation3 = "1.2.0"
coreKtx = "1.18.0"

# --- Kotlin ecosystem ---
coroutines = "1.11.0"
datetime = "0.8.0"
serialization = "1.11.0"

# --- Testing ---
# JUnit 6 (Platform/Jupiter/Vintage share one version number). The unit tests
# run on Jupiter; the Compose screen tests stay on the JUnit 4 API because
# androidx.compose.ui:ui-test-junit4 is the only test-rule artifact Compose ships.
junit = "6.1.3"
junitExt = "1.3.0"
espresso = "3.7.0"
robolectric = "4.17"
turbine = "1.2.1"
mockk = "1.14.11"

# --- Project Data ---
projectApplicationId = "com.kswallet"
projectApplicationName = "KsWallet"
projectCompileSdkVersion = "37"
projectJavaVersion = "17"
projectMinSdkVersion = "26"
projectTargetSdkVersion = "37"
projectVersion = "1.0.0"
projectVersionCode = "1"

# ═══════════════════════════════════════════════════════════════════════════
[libraries]
# ═══════════════════════════════════════════════════════════════════════════

# --- Build logic classpath (consumed by build-logic/convention) ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
koin-gradlePlugin = { group = "io.insert-koin", name = "koin-compiler-gradle-plugin", version.ref = "koinCompilerPlugin" }

# --- AndroidX core / lifecycle ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# --- Compose ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Navigation ---
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# --- Persistence ---
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Kotlin ecosystem ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- Koin (versions come from the BOM) ---
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
koin-annotations = { group = "io.insert-koin", name = "koin-annotations" }

# --- Testing ---
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# ═══════════════════════════════════════════════════════════════════════════
[plugins]
# ═══════════════════════════════════════════════════════════════════════════

# ── First-party tool plugins (from Maven repositories) ─────────────────────
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinCompilerPlugin" }

# --- Project convention plugins (provided by the included build-logic build) ---
kswallet-kotlin-library = { id = "kswallet.kotlin.library" }
kswallet-android-library = { id = "kswallet.android.library" }
kswallet-android-library-compose = { id = "kswallet.android.library.compose" }
kswallet-android-di = { id = "kswallet.android.di" }
kswallet-android-feature = { id = "kswallet.android.feature" }
kswallet-android-application = { id = "kswallet.android.application" }
