## ---------------------------------------------------------------------------
## KsWallet version catalog — the single source of truth for every dependency,
## plugin and SDK level used by the project.
## ---------------------------------------------------------------------------

# --------------------------
[versions]
# --------------------------

# Build plugins
agp = "9.4.1"
kotlin = "2.4.21"

# Compose ui
compose = "1.12.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"

# Kotlin externals
coroutines = "1.11.0"

# DI
koin = "4.2.2"

# Testing
junit = "6.1.3"
junit4 = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"

# Android SDK
projectCompileSdkVersion = "37"
projectMinSdkVersion = "26"
projectTargetSdkVersion = "37"

# Java / JVM
projectJavaVersion = "17"

# Application metadata
projectApplicationId = "com.kswallet"
projectApplicationName = "KsWallet"
projectVersion = "0.1.0"
projectVersionCode = "1"

# NeoTheme catalog app metadata
neoCatalogApplicationId = "com.neodesign.catalog"
neoCatalogVersion = "0.1.0"
neoCatalogVersionCode = "1"

# --------------------------
[libraries]
# --------------------------

# --- Compose core ---
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
androidx-compose-runtime-saveable = { group = "androidx.compose.runtime", name = "runtime-saveable", version.ref = "compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }

# --- Lifecycle ---
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

# --- Coroutines ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Koin ---
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }

# --- Compose previews and tooling ---
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }

# --- Activity integration ---
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

# --- Gradle Plugins (for Convention plugins) ---
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# --- Testing ---
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

# --- Android instrumentation testing ---
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }

# --- Compose instrumentation testing ---
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

# --------------------------
[plugins]
# --------------------------

# --- First-party tool plugins (from Maven repositories) ---
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# --- Project convention plugins (provided by the included build-logic build) ---
kswallet-android-application = { id = "kswallet.android.application" }
kswallet-android-compose = { id = "kswallet.android.compose" }
kswallet-android-library = { id = "kswallet.android.library" }
kswallet-kotlin-library = { id = "kswallet.kotlin.library" }